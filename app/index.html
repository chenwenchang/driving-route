<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <meta name="description" content="剑桥路考路线：路线、注意点、环岛走法、导航导出">
  <title>路考路线 · Cambridge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <div id="app">
    <section id="view-list" class="view">
      <header class="appbar">
        <div class="brand">
          <span class="logo" id="logo"></span>
          <div><b>路考路线</b><small>Cambridge (Brookmount Court)</small></div>
        </div>
        <div class="row">
          <button class="btn sm primary hidden" id="btn-install" title="安装到手机桌面，离线也能用"></button>
          <button class="btn icon ghost" id="btn-import" title="导入路线包" aria-label="导入路线包"></button>
          <button class="btn icon ghost" id="btn-settings" title="设置" aria-label="设置"></button>
        </div>
      </header>
      <main class="list-main">
        <div id="route-list" class="route-list"></div>
        <div class="card hint" id="list-hint"></div>
      </main>
    </section>

    <section id="view-route" class="view hidden">
      <div id="map"></div>
      <header class="route-bar">
        <button class="btn icon ghost" id="btn-back" aria-label="返回"></button>
        <div class="grow ellipsis"><b id="route-title" class="ellipsis"></b><small id="route-sub" class="ellipsis"></small></div>
        <button class="btn icon ghost" id="btn-fit" title="显示整条路线" aria-label="显示整条路线"></button>
      </header>
      <button class="gps-banner hidden" id="gps-banner" type="button" aria-live="polite"></button>
      <section id="sheet" class="sheet" data-state="half" aria-label="路线信息">
        <div class="sheet-handle" id="sheet-handle" role="button" aria-label="拖动调整面板高度"><span></span></div>
        <nav class="sheet-tabs" id="sheet-tabs">
          <button data-tab="points" aria-selected="true">要点</button>
          <button data-tab="rbs">环岛</button>
          <button data-tab="steps">指令</button>
          <button data-tab="nav">导航/导出</button>
          <span class="spacer"></span>
          <button class="btn primary sm" id="btn-review">预习 ▶</button>
        </nav>
        <div class="sheet-body" id="sheet-body"></div>
      </section>
    </section>
  </div>

  <dialog class="dlg" id="dlg-settings">
    <div class="dlg-head"><h3>设置</h3><button class="btn icon ghost" data-close aria-label="关闭">✕</button></div>
    <div class="dlg-body">
      <label class="field">主题
        <select id="set-theme"><option value="">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
      </label>
      <label class="field">GPX 航点语言（OsmAnd 语音播报会读航点名）
        <select id="set-gpx"><option value="zh">中文</option><option value="en">English</option></select>
      </label>
      <label class="field">Google 街景内嵌 API Key（可选，不填则点"街景"跳转 Google 地图）
        <input type="password" id="set-svkey" placeholder="Maps Embed API key" autocomplete="off">
      </label>
      <div class="opt"><h4>数据</h4><p id="set-where"></p>
        <div class="row wrap"><button class="btn sm danger" id="set-clear">清除本浏览器里导入的路线</button></div>
      </div>
      <div class="opt"><h4>关于</h4>
        <p>地图 © OpenStreetMap contributors；卫星图 © Esri；路由 OSRM；自动识别数据来自 OSM，可能不全或过时，一切以现场标志为准。规则编号仅供参考，以官方 Highway Code 为准。开车时不要操作手机。</p>
      </div>
    </div>
  </dialog>
  <input type="file" id="file-import" accept=".json,application/json" hidden>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
